name = "matomo-tracker-worker-bxd"
main = "dist/index.js"
compatibility_date = "2024-12-08"
compatibility_flags = ["nodejs_compat"]

[build]
command = "npm run build"

[dev]
port = 8787
local_protocol = "https"

[vars]
MATOMO_URL = "https://matomo.bellerosexd.com"
MATOMO_SITE_ID = "2"
MATOMO_TIMEOUT_MS = "5000"
LOG_LEVEL = "warn"
USER_AGENT_ALLOWLIST_REGEX = " "
DOCUMENT_REGEX = " "
